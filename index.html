<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Metadatos esenciales para navegadores y dispositivos móviles -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProgramStyle | Páginas web empresariales</title>
  <!-- Enlace al archivo de estilos principal -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Encabezado principal con logo y navegación -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- Logo de la marca cargado desde assets, centrado en el encabezado -->
      <a href="#inicio" class="brand-logo">
        <img src="assets/logo-ProgramStyle_centrado.png" alt="Logo ProgramStyle" />
      </a>

      <!-- Barra de navegacion principal -->
      <nav class="main-nav">
        <ul>
          <li><a href="#inicio">Inicio</a></li>
          <li><a href="#servicios">Servicios</a></li>
          <li><a href="#proyectos">Proyectos</a></li>
          <li><a href="#contacto">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Sección principal de bienvenida (Hero) -->
  <main>
    <section class="hero" id="inicio">
      <div class="container hero-inner">
        <!-- Texto principal que comunica la propuesta de valor -->
        <p class="hero-label">ProgramStyle</p>
        <h1>Desarrollo de páginas web empresariales</h1>
        <p class="hero-text">
          Creamos sitios corporativos modernos, funcionales y adaptados a móviles,
          con identidad visual en negro, dorado y blanco para transmitir elegancia y confianza.
        </p>

        <!-- Botones de llamada a la acción -->
        <div class="hero-actions">
          <a href="#servicios" class="btn btn-primary">Ver servicios</a>
          <a href="#contacto" class="btn btn-secondary">Contacto</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
